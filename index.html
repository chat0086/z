<title>NexaChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1d1708;--panel:#35290e;--top:#493816;--text:#fff8e1;--muted:#e7d6a5;--accent:#fbbf24;--border:#5c4a1e;--msgme:#854d0e;--msgother:#40331a;--input:#251d0b;--soft:#090702;--green:#22c55e;--chatbg:#1d1708;--chathead:#493816;--privme:#854d0e;--privother:#40331a;--privinput:#59451d}
body{background:#1d1708;background:var(--bg);height:100vh;height:100dvh;height:100vh;height:var(--app-h,100vh);overflow:hidden;touch-action:manipulation;color:#fff8e1;color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}
button:focus,input:focus{outline:2px solid #fbbf24;outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6}
#auth-screen{position:fixed;top:0;right:0;bottom:0;left:0;background:linear-gradient(160deg,#0b1128,#060a1c);display:flex;align-items:center;justify-content:center;z-index:9999;overflow-y:auto}
#auth-screen:before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at 20% 20%,#1a2a55 0%,transparent 40%),radial-gradient(circle at 90% 80%,#1a2a55 0%,transparent 40%)}
.hacker-card{position:relative;z-index:2;width:100%;max-width:100%;min-height:100vh;padding:18px 12px 10px;font-family:Arial,sans-serif}
.hacker-logo{text-align:center;margin-bottom:18px}
.logo-icon{width:48px;height:48px;margin:0 auto 6px;border:2px solid #d4af37;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#d4af37;box-shadow:0 0 12px rgba(212,175,55,.4)}
.logo-text{color:#e8d5a0;font-size:24px;letter-spacing:1px;font-weight:700}
.logo-text span{color:#fff}
.hacker-sub{text-align:center;color:#fff;font-size:13px;margin:10px 0 18px}
.hacker-sub b{color:#e8d5a0}
.hacker-input{width:100%;background:#111a38;border:1.5px solid #d4af37;color:#fff;border-radius:16px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.hacker-btn,.hacker-btn2{width:100%;font-weight:700;border-radius:12px;padding:11px;margin-top:4px;cursor:pointer;font-size:16px}
.hacker-btn{background:linear-gradient(180deg,#f0d48a,#d4af37);color:#0b1128;border:0}
.hacker-btn2{background:transparent;color:#e8d5a0;border:1.5px solid #d4af37;margin-top:12px}
.hacker-link{color:#888;font-size:10px;text-align:center;margin-top:18px;letter-spacing:1px}
.input{position:relative}
.eye{position:absolute;right:12px;top:10px;cursor:pointer;font-size:14px;color:#ccc}
.app{display:none;height:100vh;height:100dvh;height:100vh;height:var(--app-h,100vh);flex-direction:column;min-height:0}
.app.show{display:flex}
#homeApp{background:#1d1708;background:var(--bg);padding:14px 12px;overflow-y:auto}
.neon-top{background:#493816;background:var(--top);border:1.5px solid #fbbf24;border:1.5px solid var(--accent);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.neon-card{margin-top:18px;background:#35290e;background:var(--panel);border:1.5px solid #fbbf24;border:1.5px solid var(--accent);border-radius:16px;padding:16px 14px;display:flex;align-items:center;gap:14px;cursor:pointer;flex-shrink:0}
.neon-card:focus,.neon-card.active{outline:2px solid #c084fc}
.nx-ad:focus,.nx-ad.active{outline:2px solid #c084fc}
.neon-icon{width:52px;height:52px;flex-shrink:0;border-radius:50%;border:2px solid #e879f9;display:flex;align-items:center;justify-content:center;font-size:24px}
.neon-card h3{color:#fff8e1;color:var(--text);font-size:15px;font-weight:800}
.neon-card p{color:#e7d6a5;color:var(--muted);font-size:12px}
.home-badge{display:none;margin-left:auto;background:#22c55e;background:var(--green);color:#000;font-weight:900;font-size:12px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;align-items:center;justify-content:center}
#globalApp,#onlineApp,#inboxApp{background:#251d0b;background:var(--input);color:#fff8e1;color:var(--text)}
#globalApp,#inboxApp{position:relative}
.top-g{height:48px;flex-shrink:0;background:#493816;background:var(--top);border-bottom:2px solid #fbbf24;border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
.online-badge{background:#0a2e1f;border:1px solid #22c55e;border:1px solid var(--green);color:#4ade80;font-size:10px;padding:3px 7px;border-radius:12px;white-space:nowrap}
.chat-area{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;overflow-wrap:anywhere;word-wrap:break-word;border-radius:12px;padding:8px 10px;border:1.2px solid}
.msg.other{align-self:flex-start;background:#40331a;background:var(--msgother);border-color:#a78bfa}
.msg.me{align-self:flex-end;background:#854d0e;background:var(--msgme);border-color:#fbbf24;border-color:var(--accent)}
.msg.highlight{border-color:#fde047!important;box-shadow:0 0 14px rgba(253,224,71,.7)!important}
.msg.mention{color:#fde047;font-weight:900;background:rgba(253,224,71,.18);padding:0 4px;border-radius:4px}
#mentionPopup{position:absolute;bottom:84px;left:8px;width:180px;background:#35290e;background:var(--panel);border:2px solid #fde047;border-radius:10px;padding:6px;display:none;z-index:50;max-height:140px;overflow-y:auto}
.mention-item{padding:7px 8px;border-radius:6px;font-size:12px;color:#fff8e1;color:var(--text);cursor:pointer}
.mention-item.active{background:#fde047;color:#000;font-weight:900}
#globalTyping{display:none;padding:6px 12px;color:#fde047;font-size:11px;font-style:italic;background:#35290e;background:var(--panel);border-top:1px solid #5c4a1e;border-top:1px solid var(--border)}
.top-i{height:52px;flex-shrink:0;background:#493816;background:var(--top);border-bottom:2px solid #fbbf24;border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:center}
.top-i h1{font-size:22px;color:#fbbf24;color:var(--accent)}
.search-box{height:48px;flex-shrink:0;background:#493816;background:var(--top);padding:6px 10px;border-bottom:1px solid #5c4a1e;border-bottom:1px solid var(--border)}
.search-box input{width:100%;height:100%;background:#251d0b;background:var(--input);border:1.2px solid #fbbf24;border:1.2px solid var(--accent);border-radius:10px;color:#fff8e1;color:var(--text);padding:0 10px 0 12px;font-size:13px}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.row{min-height:60px;flex-shrink:0;background:#35290e;background:var(--panel);border:1px solid #5c4a1e;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;padding:8px 10px;gap:8px;cursor:pointer;overflow-wrap:anywhere;word-wrap:break-word}
.row:hover,.row.active,.row:focus{border-color:#fbbf24!important;border-color:var(--accent)!important;background:#493816!important;background:var(--top)!important;outline:none}
.row.unread{background:#0c2a24;border:1.5px solid #22c55e;box-shadow:0 0 10px rgba(34,197,94,.35)}
.row.unread .avatar{border-color:#22c55e}
.unread-badge{flex-shrink:0;background:#22c55e;color:#000;font-weight:900;font-size:12px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#493816;background:var(--top);border:1.5px solid #334155;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff8e1;color:var(--text)}
.status.online{background:#0a2e1f;color:#4ade80;border:1px solid #22c55e;padding:2px 6px;border-radius:10px;font-size:9px}
.status.offline{background:#1a1a1a;color:#94a3b8;border:1px solid #555;padding:2px 6px;border-radius:10px}
#inboxOptions,#chatOptions{position:absolute;bottom:38px;left:6px;width:210px;background:#35290e;background:var(--panel);border:2px solid #fbbf24;border:2px solid var(--accent);border-radius:12px;padding:6px;display:none;z-index:99;max-height:75%;overflow-y:auto}
.opt-btn{width:100%;padding:10px;background:#493816;background:var(--top);border:1px solid #5c4a1e;border:1px solid var(--border);border-radius:8px;color:#fff8e1;color:var(--text);margin-bottom:6px;cursor:pointer;text-align:left;font-size:12px}
.opt-btn:hover,.opt-btn:focus,.opt-btn.active{background:#251d0b;background:var(--input);border-color:#fbbf24;border-color:var(--accent);outline:none}
#blockedView,#settingsView{position:absolute;top:0;right:0;bottom:0;left:0;background:#251d0b;background:var(--input);z-index:100;display:none;flex-direction:column;color:#fff8e1;color:var(--text)}
.settings-content{flex:1;overflow-y:auto;padding:12px}
.settings-card{background:#35290e;background:var(--panel);border:1px solid #fbbf24;border:1px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:12px}
.settings-title{font-size:14px;font-weight:bold;color:#fbbf24;color:var(--accent);margin-bottom:10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #5c4a1e;border-bottom:1px solid var(--border);font-size:13px}
.setting-row:last-child{border-bottom:0}
